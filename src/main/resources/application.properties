spring.application.name=mobilehub-storefront
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mobilehub?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:MySuperSecretKeyForMobileHubProject2026Secure}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.admin.emails=${ADMIN_EMAILS:admin@mobilehub.com}
