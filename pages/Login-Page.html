<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12345a">
    <title>Login | MobileHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/storefront.css">
    <script src="../scripts/cart.js" defer></script>
    <script src="../scripts/storefront.js" defer></script>
    <script src="../scripts/auth.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-top"><a class="brand" href="Home-Page.html" aria-label="MobileHub home"><span class="brand-mark">M</span><span class="brand-name">Mobile<span>Hub</span></span></a><form class="header-search" data-header-search action="Products.html" role="search"><label class="sr-only" for="login-search">Search smartphones</label><input id="login-search" type="search" placeholder="Search phones, brands and models"><button type="submit" aria-label="Search">⌕</button></form><div class="header-actions"><a class="nav-cart" href="Cart.html">Cart <span class="cart-count" data-cart-count>0</span></a></div></div>
        <nav class="site-nav" aria-label="Main navigation"><a href="Home-Page.html">Home</a><a href="Products.html">All phones</a><a href="About.html">About</a><a href="Contact.html">Contact</a><a href="Login-Page.html" aria-current="page">Login</a><a href="Register-Page.html">Register</a></nav>
    </header>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-heading">
            <p class="eyebrow">YOUR MOBILEHUB ACCOUNT</p>
            <h1 id="login-heading">Sign in</h1>
            <form class="auth-form" data-login-form>
                <p class="auth-status" data-auth-status aria-live="polite"></p>
                <div class="form-field">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="email" maxlength="254" autocomplete="email" placeholder="Enter email" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="72" autocomplete="current-password" placeholder="Enter password" required>
                </div>
                <div class="auth-actions">
                    <button class="button button-coral" type="submit">Login</button>
                    <button class="button button-secondary" type="reset">Cancel</button>
                </div>
            </form>
            <p class="auth-links">New to MobileHub? <a href="Register-Page.html">Create an account</a></p>
        </section>
    </main>
    <footer class="site-footer"><div class="footer-main"><a class="brand brand-light" href="Home-Page.html"><span class="brand-mark">M</span><span class="brand-name">Mobile<span>Hub</span></span></a><p>Find your next favourite phone.</p></div><div class="footer-links"><a href="About.html">About Us</a><a href="Contact.html">Contact</a><a href="Privacy-Policy.html">Privacy Policy</a></div><div class="footer-social"><span>Follow along</span><a href="https://www.instagram.com/" target="_blank" rel="noreferrer">Instagram ↗</a><a href="https://www.facebook.com/" target="_blank" rel="noreferrer">Facebook ↗</a></div><small>© 2026 MobileHub · Demo storefront</small></footer>
</body>

</html>
